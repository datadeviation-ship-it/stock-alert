name: Stock Alert
on:
  schedule:
    # USA market open - ljetno računanje vremena: 09:32 ET = 13:32 UTC
    - cron: '32 13 * * 1-5'

    # USA market open - zimsko računanje vremena: 09:32 ET = 14:32 UTC
    - cron: '32 14 * * 1-5'

  workflow_dispatch:
jobs:
  provjeri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pokreni provjeru
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "FMP key duljina: ${#FMP_API_KEY}"
          echo "Telegram token duljina: ${#TELEGRAM_TOKEN}"
          echo "Chat ID: ***"
          python stock_alert.py
