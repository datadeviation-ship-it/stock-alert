name: Stock Alert

on:
  schedule:
    # US market open do 1h prije zatvaranja
    # Ljeto:
    # 09:30–15:00 ET = 15:30–21:00 Zagreb = 13:30–19:00 UTC

    # 09:30 i 09:45 ET
    - cron: '30,45 13 * * 1-5'

    # 10:00–14:45 ET
    - cron: '0,15,30,45 14-18 * * 1-5'

    # 15:00 ET, zadnja provjera sat vremena prije zatvaranja
    - cron: '0 19 * * 1-5'

  workflow_dispatch:

concurrency:
  group: stock-alert-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  provjeri:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pokreni provjeru
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "FMP key duljina: ${#FMP_API_KEY}"
          echo "Telegram token duljina: ${#TELEGRAM_TOKEN}"
          echo "Chat ID: ***"
          python stock_alert.py

      - name: Spremi state file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f stock_alert_poslano.json ]; then
            git add stock_alert_poslano.json

            if git diff --cached --quiet; then
              echo "Nema promjene u state fileu."
            else
              git commit -m "Update stock alert state"
              git pull --rebase origin main
              git push
            fi
          else
            echo "Nema state filea za spremiti."
          fi
